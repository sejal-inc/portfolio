<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missing piece — Sejal Jain</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121011">
<link rel="stylesheet" href="assets/css/main.css">
<script>try{if(sessionStorage.getItem("sj.pt"))document.documentElement.classList.add("pt-in")}catch(e){}</script>
<style>html,body{overflow:hidden}</style>
</head>
<body data-page="404" data-footer="off">
<main class="page lost">
  <canvas id="pile" aria-hidden="true"></canvas>
  <div class="lost-text">
    <p class="kicker" style="justify-content:center">Error 404</p>
    <h1 class="display h2">This page is the <span class="accent">missing piece.</span></h1>
    <p class="muted" style="color:rgba(245,240,230,.7)">Push the pieces around for a bit, then head home.</p>
    <a class="btn btn--light" href="index.html">Back home</a>
  </div>
</main>
<script src="assets/js/site.js" defer></script>
<script>
/* Hand-written physics: puzzle pieces fall, stack and get flung by the pointer */
addEventListener('DOMContentLoaded', function () {
  var cv = document.getElementById('pile'), cx = cv.getContext('2d');
  var PIECE = new Path2D('M20 30H40C38 16 62 16 60 30H80V50C94 48 94 72 80 70V90H60C62 78 38 78 40 90H20V70C32 72 32 48 20 50Z');
  var cols = ['#FF0592', '#F5F0E6', '#FF0592', '#ECE5D8', '#FFD3EA'], W, H, B = [], m = { x: -999, y: -999, vx: 0, vy: 0, grab: null }, lx = 0, ly = 0;
  function size() { var d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  size(); addEventListener('resize', size);
  var n = Math.round(Math.min(44, Math.max(16, W * H / 28000)));
  for (var i = 0; i < n; i++) { var r = (W < 600 ? 22 : 30) + Math.random() * 20; B.push({ x: r + Math.random() * (W - 2 * r), y: -Math.random() * H * 1.4 - r, vx: (Math.random() - .5) * 2, vy: 0, a: Math.random() * 6.3, va: 0, r: r, c: cols[i % cols.length] }); }
  function step() {
    B.forEach(function (b) {
      if (b === m.grab) { b.vx = (m.x - b.x) * .35; b.vy = (m.y - b.y) * .35; } else b.vy += .42;
      b.vx *= .992; b.vy *= .992; b.x += b.vx; b.y += b.vy; b.a += b.va; b.va *= .98;
      if (b.y > H - b.r) { b.y = H - b.r; b.vy *= -.35; b.vx *= .9; b.va += b.vx * .002; }
      if (b.x < b.r) { b.x = b.r; b.vx *= -.35; } if (b.x > W - b.r) { b.x = W - b.r; b.vx *= -.35; }
      if (b !== m.grab) { var dx = b.x - m.x, dy = b.y - m.y, d = Math.hypot(dx, dy), R = b.r + 40; if (d < R && d > 0) { var p = (R - d) / R; b.vx += dx / d * p * 2.2 + m.vx * .06 * p; b.vy += dy / d * p * 2.2 + m.vy * .06 * p; } }
    });
    for (var k = 0; k < 3; k++) for (var i = 0; i < B.length; i++) for (var j = i + 1; j < B.length; j++) {
      var a = B[i], o = B[j], dx = o.x - a.x, dy = o.y - a.y, min = (a.r + o.r) * .86, dd = dx * dx + dy * dy;
      if (dd >= min * min || !dd) continue;
      var d = Math.sqrt(dd), nx = dx / d, ny = dy / d, ov = (min - d) / 2;
      a.x -= nx * ov; a.y -= ny * ov; o.x += nx * ov; o.y += ny * ov;
      var rv = (o.vx - a.vx) * nx + (o.vy - a.vy) * ny;
      if (rv < 0) { var im = -1.35 * rv / 2; a.vx -= im * nx; a.vy -= im * ny; o.vx += im * nx; o.vy += im * ny; }
    }
  }
  function draw() {
    cx.clearRect(0, 0, W, H);
    B.forEach(function (b) { var s = b.r * 2 / 74; cx.save(); cx.translate(b.x, b.y); cx.rotate(b.a); cx.scale(s, s); cx.translate(-50, -54); cx.fillStyle = b.c; cx.fill(PIECE); cx.restore(); });
  }
  cv.addEventListener('pointermove', function (e) { m.vx = e.clientX - lx; m.vy = e.clientY - ly; lx = m.x = e.clientX; ly = m.y = e.clientY; });
  cv.addEventListener('pointerdown', function (e) {
    m.x = e.clientX; m.y = e.clientY;
    var best = null, bd = 1e9; B.forEach(function (b) { var d = Math.hypot(b.x - m.x, b.y - m.y); if (d < b.r && d < bd) { bd = d; best = b; } });
    m.grab = best; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointerup', function () { m.grab = null; });
  cv.addEventListener('pointerleave', function () { if (!m.grab) m.x = m.y = -999; });
  (function loop() { step(); m.vx *= .8; m.vy *= .8; draw(); requestAnimationFrame(loop); })();
});
</script>
</body>
</html>
