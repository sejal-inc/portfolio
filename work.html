<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selected work — Sejal Jain</title>
<meta name="description" content="Selected brand, packaging, event and report design by Sejal Jain, 2023 to 2025.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&family=Hanken+Grotesk:wght@400..700&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400..700&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .w-head { padding: clamp(100px, 13vh, 130px) var(--gutter-r) 8px var(--gutter-l); text-align: center; }
  .w-head h1 { font-size: clamp(40px, 5.2vw, 78px); margin: 10px 0 10px; text-wrap: balance; }
  .w-head h1 em { color: var(--tomato); }
  .w-head p { margin: 0 auto; max-width: 46ch; color: var(--ink-soft); }

  .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 20px var(--gutter-r) 0 var(--gutter-l); max-width: 980px; margin: 0 auto; }
  .tab {
    font: inherit; font-size: 14px; font-weight: 500;
    display: inline-flex; align-items: baseline; gap: 8px;
    padding: 9px 16px; border-radius: 999px;
    border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
    transition: background .25s, color .25s, transform .4s var(--spring);
  }
  .tab small { font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; }
  .tab:hover { transform: translateY(-2px) rotate(-1deg); }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }

  .flow {
    position: relative; height: clamp(340px, 52vh, 500px);
    perspective: 1400px; margin-top: 24px; overflow: hidden;
    touch-action: pan-y; user-select: none;
  }
  .card {
    position: absolute; left: 50%; top: 50%;
    width: clamp(180px, 21vw, 290px); aspect-ratio: 4 / 5;
    margin: 0; translate: -50% -50%;
    transition: transform .7s var(--spring), opacity .5s, filter .5s;
    transform-style: preserve-3d;
    cursor: pointer;
  }
  .card .ph { width: 100%; height: 100%; box-shadow: 0 24px 50px -24px color-mix(in srgb, var(--ink) 45%, transparent); }
  .card.is-active { cursor: default; }
  .flow-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 10px; }
  .arrow {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink);
    font-size: 20px; display: grid; place-items: center;
    transition: transform .4s var(--spring), background .2s, color .2s;
  }
  .arrow:hover { background: var(--ink); color: var(--paper); transform: scale(1.08); }
  .ticks { display: flex; gap: 6px; }
  .ticks i { width: 18px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 20%, transparent); transition: background .3s, width .3s; }
  .ticks i.on { background: var(--ink); width: 30px; }

  .info {
    max-width: 980px; margin: 36px auto 0; padding: 18px var(--gutter-r) 0 var(--gutter-l);
    display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.6fr; gap: 20px;
    border-top: 1.5px solid var(--ink);
  }
  .info dt { color: var(--ink-soft); margin-bottom: 6px; }
  .info dd { margin: 0; font-size: 15px; }
  .info dd.big { font-family: var(--display); font-variation-settings: var(--display-vars); font-size: 26px; line-height: 1.1; }
  .note { max-width: 980px; margin: 18px auto clamp(80px, 12vw, 140px); padding: 0 var(--gutter-r) 0 var(--gutter-l); font-size: 13px; color: var(--ink-soft); }

  @media (max-width: 760px) {
    .tabs { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; padding-bottom: 4px; }
    .tab { flex: none; }
    .card { width: 62vw; }
    .info { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body data-page="work">
<main class="page">
  <header class="w-head">
    <p class="label" style="color:var(--tomato);margin:0 auto;max-width:none">Selected work</p>
    <h1 class="display">Things I&rsquo;ve <em>made</em>, brand by brand.</h1>
    <p>Packaging, events, reports and identities from studios and in-house roles. Pick a brand, then drag or use the arrows.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Brands" id="tabs"></div>
  <div class="flow" id="flow" aria-live="polite"></div>
  <div class="flow-nav">
    <button class="arrow" type="button" id="prev" aria-label="Previous piece">&larr;</button>
    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <button class="arrow" type="button" id="next" aria-label="Next piece">&rarr;</button>
  </div>

  <dl class="info" id="info">
    <div><dt class="label">Brand</dt><dd class="big" id="iBrand"></dd></div>
    <div><dt class="label">Year</dt><dd id="iYear"></dd></div>
    <div><dt class="label">With</dt><dd id="iWith"></dd></div>
    <div><dt class="label">What I did</dt><dd id="iRole"></dd></div>
  </dl>
  <p class="note">All images are placeholders for now.</p>
</main>

<script src="assets/js/drawings.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  /* One entry per brand. Replace pieces with real images later: { img: 'assets/work/g20-1.jpg', alt: '...' } */
  var BRANDS = [
    { name: 'Annual report', sub: 'SaaS company', year: '2025', with: 'In-house', role: '[Report design and data visuals]', color: 'var(--tomato)', d: 'd-blog', pieces: 5 },
    { name: 'G20', year: '2023', with: 'Design Brewery', role: '[What you worked on]', color: 'var(--sky)', d: 'd-photos', pieces: 5 },
    { name: 'Ledure', sub: 'Lighting', year: '2023', with: 'Design Brewery', role: '[Packaging design]', color: 'var(--butter)', d: 'd-lantana', pieces: 4 },
    { name: '[Arcade brand]', year: '2023', with: 'Design Brewery', role: '[Brand identity]', color: 'var(--pink)', d: 'd-piece', pieces: 4 },
    { name: 'TEDx', year: '2024', with: 'Spread Design', role: '[Event identity]', color: 'var(--tomato)', d: 'd-mirror', pieces: 5 },
    { name: 'MAHE Bengaluru', year: '2024', with: 'Spread Design', role: '[What you worked on]', color: 'var(--forest)', d: 'd-sketchbook', pieces: 4 },
    { name: 'GOx', year: '2024', with: 'Spread Design', role: '[What you worked on]', color: 'var(--blush)', d: 'd-envelope', pieces: 4 },
    { name: '[Beverage brand]', sub: '3D models', year: '[Year]', with: '[Studio or freelance]', role: '[3D product models]', color: 'var(--sky)', d: 'd-pencil', pieces: 4 }
  ];
  var SHAPES = ['50%', '999px 999px 22px 22px', '28px', '22px 22px 999px 999px', '50% 50% 28px 28px / 40% 40% 28px 28px'];

  var tabs = document.getElementById('tabs'), flow = document.getElementById('flow'), ticks = document.getElementById('ticks');
  var brand = 0, idx = 0, cards = [];
  var narrow = function () { return innerWidth < 760; };

  BRANDS.forEach(function (b, i) {
    var t = document.createElement('button');
    t.className = 'tab'; t.type = 'button'; t.setAttribute('role', 'tab');
    t.innerHTML = b.name.replace(/[\[\]]/g, '') + ' <small>' + b.year.replace(/[\[\]]/g, '') + '</small>';
    t.addEventListener('click', function () { selectBrand(i); });
    tabs.appendChild(t);
  });

  function selectBrand(i) {
    brand = i; idx = Math.floor(BRANDS[i].pieces / 2);
    [].forEach.call(tabs.children, function (t, j) { t.setAttribute('aria-selected', j === i ? 'true' : 'false'); });
    var b = BRANDS[i];
    flow.innerHTML = ''; ticks.innerHTML = ''; cards = [];
    for (var k = 0; k < b.pieces; k++) {
      var c = document.createElement('figure');
      c.className = 'card';
      var bg = k % 2 ? 'var(--cream)' : b.color;
      c.innerHTML = '<div class="ph" style="border-radius:' + SHAPES[(k + i) % SHAPES.length] + ';background:' + bg + '">' +
        '<svg class="ph-art drawing" viewBox="0 0 ' + (b.d === 'd-piece' ? '100 100' : '200 200') + '" aria-hidden="true" style="color:var(--ink)"><use href="#' + b.d + '"/></svg>' +
        '<span class="ph-note">' + b.name.replace(/[\[\]]/g, '') + ' · ' + (k + 1) + '</span></div>';
      (function (k) { c.addEventListener('click', function () { if (!dragged && k !== idx) go(k); }); })(k);
      flow.appendChild(c); cards.push(c);
      ticks.appendChild(document.createElement('i'));
    }
    document.getElementById('iBrand').textContent = b.name + (b.sub ? ' · ' + b.sub : '');
    document.getElementById('iYear').textContent = b.year;
    document.getElementById('iWith').textContent = b.with;
    document.getElementById('iRole').textContent = b.role;
    layout(0);
  }

  function layout(drag) {
    var gap = narrow() ? innerWidth * 0.42 : Math.min(260, innerWidth * 0.17);
    cards.forEach(function (c, k) {
      var o = k - idx + (drag || 0);
      var a = Math.abs(o);
      c.style.transform = 'translateX(' + (o * gap) + 'px) translateZ(' + (-a * 140) + 'px) rotateY(' + (Math.max(-1, Math.min(1, o)) * -38) + 'deg)';
      c.style.zIndex = 100 - Math.round(a * 10);
      c.style.opacity = a > 2.6 ? 0 : 1 - a * 0.18;
      c.style.filter = 'saturate(' + (1 - Math.min(a, 1) * 0.35) + ')';
      c.classList.toggle('is-active', k === idx);
    });
    [].forEach.call(ticks.children, function (t, k) { t.classList.toggle('on', k === idx); });
  }

  function go(n) {
    var len = cards.length;
    idx = (n + len) % len;
    layout(0);
  }
  document.getElementById('prev').addEventListener('click', function () { go(idx - 1); });
  document.getElementById('next').addEventListener('click', function () { go(idx + 1); });
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') go(idx - 1);
    if (e.key === 'ArrowRight') go(idx + 1);
  });
  addEventListener('resize', function () { layout(0); });

  /* Drag or swipe */
  var startX = null, dx = 0, dragged = false;
  flow.addEventListener('pointerdown', function (e) { startX = e.clientX; dx = 0; dragged = false; cards.forEach(function (c) { c.style.transition = 'none'; }); });
  addEventListener('pointermove', function (e) {
    if (startX === null) return;
    dx = e.clientX - startX;
    var gap = narrow() ? innerWidth * 0.42 : Math.min(260, innerWidth * 0.17);
    layout(dx / gap);
  });
  function end() {
    if (startX === null) return;
    cards.forEach(function (c) { c.style.transition = ''; });
    startX = null; dragged = Math.abs(dx) > 6;
    var gap = narrow() ? innerWidth * 0.42 : Math.min(260, innerWidth * 0.17);
    var steps = Math.round(-dx / gap);
    if (Math.abs(dx) > 30 && steps === 0) steps = dx < 0 ? 1 : -1;
    if (steps) go(idx + steps); else layout(0);
  }
  addEventListener('pointerup', end);
  addEventListener('pointercancel', end);

  selectBrand(0);
})();
</script>
</body>
</html>
